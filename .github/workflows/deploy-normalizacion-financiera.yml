name: deploy-normalizacion-financiera

on:
  push:
    branches: [main]
    paths:
      - "functions/normalizacion-financiera/**"
      - "config/xbrl_crosswalk.json"
      - "config/xbrl_crosswalk.ndjson"
      - ".github/workflows/deploy-normalizacion-financiera.yml"
  workflow_dispatch:

concurrency:
  group: deploy-normalizacion-financiera
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: normalizacion-financiera
          region: us-east1
          source: functions/normalizacion-financiera
          flags: --port=8080 --memory=1Gi --cpu=1 --concurrency=80 --service-account=846229407230-compute@developer.gserviceaccount.com --clear-base-image --timeout=900