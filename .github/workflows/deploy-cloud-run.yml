  extraccion_json_item2:
    needs: [cambios, extraccion_json_china]
    if: ${{ !cancelled() && needs.cambios.outputs.extraccion_json_item2 == 'true' }}
    uses: ./.github/workflows/deploy-extraccion-json-item2.yml
    secrets: inherit

  extraccion_json_item4:
    needs: [cambios, extraccion_json_item2]
    if: ${{ !cancelled() && needs.cambios.outputs.extraccion_json_item4 == 'true' }}
    uses: ./.github/workflows/deploy-extraccion-json-item4.yml
    secrets: inherit

  extraccion_tablas_item2:
    needs: [cambios, extraccion_json_item4]
    if: ${{ !cancelled() && needs.cambios.outputs.extraccion_tablas_item2 == 'true' }}
    uses: ./.github/workflows/deploy-extraccion-tablas-item2.yml
    secrets: inherit

  extraccion_xbrl_10k:
    needs: [cambios, extraccion_tablas_item2]
    if: ${{ !cancelled() && needs.cambios.outputs.extraccion_xbrl_10k == 'true' }}
    uses: ./.github/workflows/deploy-extraccion-xbrl-10k.yml
    secrets: inherit

  extraccion_xbrl_20f:
    needs: [cambios, extraccion_xbrl_10k]
    if: ${{ !cancelled() && needs.cambios.outputs.extraccion_xbrl_20f == 'true' }}
    uses: ./.github/workflows/deploy-extraccion-xbrl-20f.yml
    secrets: inherit

  extraccion_xbrl_china_a:
    needs: [cambios, extraccion_xbrl_20f]
    if: ${{ !cancelled() && needs.cambios.outputs.extraccion_xbrl_china_a == 'true' }}
    uses: ./.github/workflows/deploy-extraccion-xbrl-china-a.yml
    secrets: inherit

  extraccion_xbrl_china_h:
    needs: [cambios, extraccion_xbrl_china_a]
    if: ${{ !cancelled() && needs.cambios.outputs.extraccion_xbrl_china_h == 'true' }}
    uses: ./.github/workflows/deploy-extraccion-xbrl-china-h.yml
    secrets: inherit

  extraer_seccion_china:
    needs: [cambios, extraccion_xbrl_china_h]
    if: ${{ !cancelled() && needs.cambios.outputs.extraer_seccion_china == 'true' }}
    uses: ./.github/workflows/deploy-extraer-seccion-china.yml
    secrets: inherit

  normalizacion_financiera:
    needs: [cambios, extraer_seccion_china]
    if: ${{ !cancelled() && needs.cambios.outputs.normalizacion_financiera == 'true' }}
    uses: ./.github/workflows/deploy-normalizacion-financiera.yml
