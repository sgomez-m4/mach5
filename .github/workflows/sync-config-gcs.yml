name: sync-config-gcs

# Los servicios leen sus configuraciones desde gs://<bucket>/config/, no del repo.
# Sin este workflow, cambiar un archivo en config/ no surte ningun efecto hasta que
# alguien lo sube a mano, y el repo queda como documentacion de algo que no esta
# corriendo. Este job cierra esa brecha: cada merge a main que toque config/
# respalda lo que hay en GCS y sube la version del repo.

on:
  push:
    branches: [main]
    paths:
      - "config/**"
      - ".github/workflows/sync-config-gcs.yml"
  workflow_dispatch:

concurrency:
  group: sync-config-gcs
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Respaldar la configuracion actual
        run: |
          TS=$(date -u +%Y%m%dT%H%M%SZ)
          echo "Respaldando en config/backup/ con sufijo $TS"
          for f in config/*.json config/*.ndjson; do
            [ -e "$f" ] || continue
            NAME=$(basename "$f")
            BASE="${NAME%.*}"
            EXT="${NAME##*.}"
            if gcloud storage ls "gs://${{ secrets.BUCKET_NAME }}/config/$NAME" >/dev/null 2>&1; then
              gcloud storage cp \
                "gs://${{ secrets.BUCKET_NAME }}/config/$NAME" \
                "gs://${{ secrets.BUCKET_NAME }}/config/backup/${BASE}_${TS}.${EXT}"
            else
              echo "  (nuevo, sin respaldo previo): $NAME"
            fi
          done

      - name: Subir la configuracion del repo
        run: |
          for f in config/*.json config/*.ndjson; do
            [ -e "$f" ] || continue
            gcloud storage cp "$f" "gs://${{ secrets.BUCKET_NAME }}/config/$(basename "$f")"
          done

      - name: Cargar las dimensiones en BigQuery
        run: |
          set -euo pipefail
          # dim_airline y dim_aircraft_type no son solo config que leen los
          # servicios: son tablas del almacen que consultan las vistas. Hasta
          # ahora se poblaban a mano, asi que editar el catalogo en el repo no
          # cambiaba nada aguas abajo.
          #
          # La conversion vive en scripts/ y no aqui porque dim_airline lleva dos
          # columnas derivadas -group_id y match_keys- que no estan en el JSON.
          # Cargar el config crudo deja la tabla sin ellas y v_prospect_score
          # deja de compilar.
          cargar() {
            ARCHIVO="$1"; CLAVE="$2"; TABLA="$3"
            if [ ! -e "$ARCHIVO" ]; then
              echo "::warning::$ARCHIVO no existe, se omite"
              return 0
            fi
            python3 scripts/generar_dim_ndjson.py "$ARCHIVO" "$CLAVE" /tmp/dim.ndjson
            bq load --replace --source_format=NEWLINE_DELIMITED_JSON --autodetect \
              --project_id="${{ secrets.GCP_PROJECT_ID }}" \
              "dataset_integrado.$TABLA" /tmp/dim.ndjson
            echo "cargada dataset_integrado.$TABLA"
          }

          cargar config/dim_airline.json       airlines dim_airline
          cargar config/dim_aircraft_type.json models   dim_aircraft_type

      - name: Verificar
        run: |
          echo "Contenido de gs://${{ secrets.BUCKET_NAME }}/config/"
          gcloud storage ls -l "gs://${{ secrets.BUCKET_NAME }}/config/"
          for t in dim_airline dim_aircraft_type; do
            n=$(bq query --use_legacy_sql=false --format=csv \
                  --project_id="${{ secrets.GCP_PROJECT_ID }}" \
                  "SELECT COUNT(*) FROM \`${{ secrets.GCP_PROJECT_ID }}.dataset_integrado.$t\`" | tail -1)
            echo "$t: $n filas"
            if [ "$n" = "0" ]; then
              echo "::error::$t quedo vacia"
              exit 1
            fi
          done

          # Las vistas se compilan contra las dimensiones: si una carga dejo
          # fuera una columna, esto lo dice aqui y no cuando alguien consulte.
          for v in v_fleet_normalized v_prospect_score; do
            n=$(bq query --use_legacy_sql=false --format=csv \
                  --project_id="${{ secrets.GCP_PROJECT_ID }}" \
                  "SELECT COUNT(*) FROM \`${{ secrets.GCP_PROJECT_ID }}.dataset_integrado.$v\`" | tail -1)
            echo "$v: $n filas"
            if [ "$n" = "0" ]; then
              echo "::error::$v quedo vacia tras cargar las dimensiones"
              exit 1
            fi
          done
