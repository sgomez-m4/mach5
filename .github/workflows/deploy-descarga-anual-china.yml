name: deploy-descarga-anual-china

on:
  # Lo invoca .github/workflows/deploy-cloud-run.yml, que serializa los
  # despliegues. Se conserva workflow_dispatch para lanzarlo a mano.
  workflow_call:
  workflow_dispatch:

concurrency:
  group: deploy-descarga-anual-china
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: descarga-anual-china
          region: us-east1
          source: functions/descarga-anual-china
          flags: --port=8080 --memory=512Mi --cpu=1 --concurrency=80 --service-account=846229407230-compute@developer.gserviceaccount.com --clear-base-image
          env_vars: |
            FUNCTION_TARGET=extraer_reportes_anuales