name: deploy-extraccion-20f-md

on:
  push:
    branches: [main]
    paths:
      - "functions/extraccion-20f-md/**"
      - ".github/workflows/deploy-extraccion-20f-md.yml"
  workflow_dispatch:

concurrency:
  group: deploy-extraccion-20f-md
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: extraccion-20f-md
          region: europe-west1
          source: functions/extraccion-20f-md
          flags: --port=8080 --memory=1Gi --cpu=2 --concurrency=80 --service-account=846229407230-compute@developer.gserviceaccount.com --clear-base-image
          env_vars: |
            FUNCTION_TARGET=run_edgar_pipeline_20f
            SEC_API_IDENTITY=${{ secrets.SEC_API_IDENTITY_20F }}

